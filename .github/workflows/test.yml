name: C# Test

on:

  push:
    paths:
      - 'src/**/*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: '6.0'
    - name: Install dependencies
      run: dotnet restore
    - name: Build and test
      run: dotnet build && dotnet test
    - name: Display success message
      run: echo 'C# test passed successfully'